<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ortak Çizim Panosu</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      touch-action: none;
      -webkit-touch-callout: none;
      user-select: none;
      font-family: sans-serif;
    }

    #toolbar {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 16px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 1000;
      border: 1px solid #ddd;
    }

    .status {
      font-size: 13px;
      color: #16a34a;
      font-weight: bold;
    }

    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    button {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      display: block;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <span class="status">● Canlı</span>
    <input type="color" id="colorPicker" value="#0284c7">
    <button id="btnClear">Temizle</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const SUPABASE_URL = "https://bzbyfxwzreaxlxxruvcx.supabase.co";
    const SUPABASE_KEY = "Sb_publishable_Uv-o3WVpsV8gI0PgXaq88w_JuaD6pO5";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const colorPicker = document.getElementById('colorPicker');
    const btnClear = document.getElementById('btnClear');

    let isDrawing = false;
    let lastX = 0, lastY = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      gecmisiGetir();
    }
    window.addEventListener('resize', resize);
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function getCoords(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function ciz(x1, y1, x2, y2, renk, gonder = false) {
      ctx.strokeStyle = renk;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      if (gonder) {
        supabase.from('pano_elemanlari').insert([{
          tur: 'cizim',
          veri: { x1, y1, x2, y2, renk }
        }]).then();
      }
    }

    function baslat(e) {
      if (e.target !== canvas) return;
      if (e.cancelable) e.preventDefault();
      isDrawing = true;
      const p = getCoords(e);
      lastX = p.x;
      lastY = p.y;
    }

    function cizimYap(e) {
      if (!isDrawing) return;
      if (e.cancelable) e.preventDefault();
      const p = getCoords(e);
      ciz(lastX, lastY, p.x, p.y, colorPicker.value, true);
      lastX = p.x;
      lastY = p.y;
    }

    function durdur() {
      isDrawing = false;
    }

    // Dokunmatik
    canvas.addEventListener('touchstart', baslat, { passive: false });
    canvas.addEventListener('touchmove', cizimYap, { passive: false });
    window.addEventListener('touchend', durdur);
    window.addEventListener('touchcancel', durdur);

    // Fare
    canvas.addEventListener('mousedown', baslat);
    window.addEventListener('mousemove', cizimYap);
    window.addEventListener('mouseup', durdur);

    // Temizle
    btnClear.addEventListener('click', async () => {
      if (confirm("Pano temizlensin mi?")) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        await supabase.from('pano_elemanlari').delete().neq('id', 0);
      }
    });

    // Geçmişi Getir (Sonradan girildiğinde çizimleri korur)
    async function gecmisiGetir() {
      const { data } = await supabase
        .from('pano_elemanlari')
        .select('*')
        .order('id', { ascending: true });

      if (data) {
        data.forEach(item => {
          if (item.tur === 'cizim' && item.veri) {
            ciz(item.veri.x1, item.veri.y1, item.veri.x2, item.veri.y2, item.veri.renk, false);
          }
        });
      }
    }
    gecmisiGetir();

    // Canlı Eşitleme
    supabase
      .channel('pano-canli')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pano_elemanlari' }, payload => {
        const item = payload.new;
        if (item && item.tur === 'cizim' && item.veri) {
          ciz(item.veri.x1, item.veri.y1, item.veri.x2, item.veri.y2, item.veri.renk, false);
        }
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'pano_elemanlari' }, () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      })
      .subscribe();
  </script>
</body>
</html>
