<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canlı Çizim Panosu</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      touch-action: none;
      -webkit-touch-callout: none;
      user-select: none;
      font-family: sans-serif;
    }

    #toolbar {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 6px 14px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 1000;
      border: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    .status {
      font-size: 12px;
      color: #16a34a;
      font-weight: bold;
    }

    input[type="color"] {
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    button {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <span class="status" id="statusText">● Hazır</span>
    <input type="color" id="colorPicker" value="#0284c7">
    <button id="btnClear">Temizle</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const colorPicker = document.getElementById('colorPicker');
    const btnClear = document.getElementById('btnClear');
    const statusText = document.getElementById('statusText');

    let isDrawing = false;
    let lastX = 0, lastY = 0;

    // Tuval boyutunu ayarla
    function resize() {
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      ctx.putImageData(img, 0, 0);
    }
    window.addEventListener('resize', resize);
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Dokunma koordinatları
    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function ciz(x1, y1, x2, y2, renk, emit = true) {
      ctx.strokeStyle = renk;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      if (emit && conn && conn.open) {
        conn.send({ type: 'draw', x1, y1, x2, y2, renk });
      }
    }

    // Çizim Dinleyicileri (Mobilde kesin çalışır)
    function start(e) {
      if (e.target !== canvas) return;
      if (e.cancelable) e.preventDefault();
      isDrawing = true;
      const p = getCoords(e);
      lastX = p.x;
      lastY = p.y;
    }

    function move(e) {
      if (!isDrawing) return;
      if (e.cancelable) e.preventDefault();
      const p = getCoords(e);
      ciz(lastX, lastY, p.x, p.y, colorPicker.value, true);
      lastX = p.x;
      lastY = p.y;
    }

    function end() {
      isDrawing = false;
    }

    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
    canvas.addEventListener('touchcancel', end);

    canvas.addEventListener('mousedown', start);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);

    btnClear.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (conn && conn.open) {
        conn.send({ type: 'clear' });
      }
    });

    // Otomatik Bağlantı (Eşinizle aynı sabit odada buluşur)
    const ODA = "ortak-pano-erdem";
    const peer = new Peer();
    let conn = null;

    peer.on('open', (id) => {
      statusText.innerText = "● Bağlantı Bekleniyor...";
      
      // Karşı tarafı aramayı dene
      conn = peer.connect(ODA);
      baglantiAyarla(conn);
    });

    // Ana istasyon olmaya çalış
    const masterPeer = new Peer(ODA);
    masterPeer.on('connection', (c) => {
      conn = c;
      baglantiAyarla(conn);
    });

    function baglantiAyarla(c) {
      c.on('open', () => {
        statusText.innerText = "● Canlı Bağlandı!";
        statusText.style.color = "#16a34a";
      });

      c.on('data', (data) => {
        if (data.type === 'draw') {
          ciz(data.x1, data.y1, data.x2, data.y2, data.renk, false);
        } else if (data.type === 'clear') {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      });
    }
  </script>
</body>
</html>
